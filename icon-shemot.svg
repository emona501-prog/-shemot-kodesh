<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="70%">
    <stop offset="0%"   stop-color="#1a0545"/>
    <stop offset="42%"  stop-color="#07011a"/>
    <stop offset="100%" stop-color="#000008"/>
  </radialGradient>
  <radialGradient id="cglow" cx="50%" cy="44%" r="52%">
    <stop offset="0%"   stop-color="#FFD700" stop-opacity="0.40"/>
    <stop offset="38%"  stop-color="#FF9500" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="np" cx="20%" cy="22%" r="55%">
    <stop offset="0%"   stop-color="#8030FF" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nb" cx="78%" cy="72%" r="48%">
    <stop offset="0%"   stop-color="#0055FF" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nr" cx="82%" cy="18%" r="42%">
    <stop offset="0%"   stop-color="#FF2858" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nc" cx="38%" cy="12%" r="38%">
    <stop offset="0%"   stop-color="#00B8FF" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="lg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#FFFBE0"/>
    <stop offset="20%"  stop-color="#FFE84A"/>
    <stop offset="55%"  stop-color="#FFC200"/>
    <stop offset="100%" stop-color="#FF8800"/>
  </linearGradient>
  <linearGradient id="lg2" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"  stop-color="#E8D0FF"/>
    <stop offset="100%" stop-color="#9060CC"/>
  </linearGradient>
  <linearGradient id="bot-fade" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#000008" stop-opacity="0"/>
    <stop offset="40%"  stop-color="#000008" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#000008" stop-opacity="0.95"/>
  </linearGradient>
  <filter id="glow-lg" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="14" result="b1"/>
    <feGaussianBlur stdDeviation="6"  result="b2" in="SourceGraphic"/>
    <feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-sm" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="cc"><circle cx="256" cy="256" r="250"/></clipPath>
</defs>

<!-- Full-square dark fill so PNG corners are never transparent -->
<rect x="0" y="0" width="512" height="512" fill="#000008"/>

<!-- Base circle -->
<circle cx="256" cy="256" r="256" fill="url(#bg)"/>

<g clip-path="url(#cc)">
  <!-- Nebulae -->
  <circle cx="256" cy="256" r="256" fill="url(#np)"/>
  <circle cx="256" cy="256" r="256" fill="url(#nb)"/>
  <circle cx="256" cy="256" r="256" fill="url(#nr)"/>
  <circle cx="256" cy="256" r="256" fill="url(#nc)"/>

  <!-- Stars – varying sizes and opacities -->
  <circle cx="55"  cy="45"  r="1.6" fill="white"   opacity="0.85"/>
  <circle cx="140" cy="28"  r="1.0" fill="#eeeeff" opacity="0.9"/>
  <circle cx="220" cy="18"  r="1.8" fill="white"   opacity="0.7"/>
  <circle cx="310" cy="35"  r="1.2" fill="#ffffdd" opacity="0.8"/>
  <circle cx="390" cy="55"  r="1.5" fill="white"   opacity="0.75"/>
  <circle cx="455" cy="100" r="1.0" fill="#ddeeff" opacity="0.9"/>
  <circle cx="490" cy="200" r="1.4" fill="white"   opacity="0.7"/>
  <circle cx="500" cy="330" r="1.0" fill="#eeeeff" opacity="0.8"/>
  <circle cx="470" cy="420" r="1.5" fill="white"   opacity="0.65"/>
  <circle cx="400" cy="478" r="1.0" fill="#ffffdd" opacity="0.8"/>
  <circle cx="290" cy="498" r="1.3" fill="white"   opacity="0.7"/>
  <circle cx="180" cy="490" r="1.0" fill="#ddeeff" opacity="0.9"/>
  <circle cx="85"  cy="455" r="1.5" fill="white"   opacity="0.65"/>
  <circle cx="20"  cy="390" r="1.2" fill="#eeeeff" opacity="0.8"/>
  <circle cx="15"  cy="270" r="1.6" fill="white"   opacity="0.7"/>
  <circle cx="28"  cy="150" r="1.0" fill="#ffffdd" opacity="0.85"/>
  <circle cx="95"  cy="320" r="0.8" fill="white"   opacity="0.6"/>
  <circle cx="430" cy="270" r="1.0" fill="#eeeeff" opacity="0.7"/>
  <circle cx="185" cy="110" r="0.9" fill="white"   opacity="0.75"/>
  <circle cx="360" cy="120" r="0.8" fill="#ddeeff" opacity="0.8"/>
  <circle cx="75"  cy="200" r="0.7" fill="white"   opacity="0.65"/>
  <circle cx="450" cy="370" r="0.9" fill="#ffffdd" opacity="0.7"/>
  <!-- sparkle cross on 2 bright stars -->
  <line x1="220" y1="12" x2="220" y2="24" stroke="white" stroke-width="0.7" opacity="0.5"/>
  <line x1="214" y1="18" x2="226" y2="18" stroke="white" stroke-width="0.7" opacity="0.5"/>
  <line x1="390" y1="49" x2="390" y2="61" stroke="white" stroke-width="0.7" opacity="0.4"/>
  <line x1="384" y1="55" x2="396" y2="55" stroke="white" stroke-width="0.7" opacity="0.4"/>

  <!-- Central glow -->
  <circle cx="256" cy="215" r="150" fill="url(#cglow)"/>

  <!-- Decorative rings -->
  <circle cx="256" cy="215" r="118" fill="none" stroke="#FFD700" stroke-width="0.6" opacity="0.18"/>
  <circle cx="256" cy="215" r="135" fill="none" stroke="#9050FF" stroke-width="0.5" opacity="0.14"/>

  <!-- Light rays from center -->
  <g opacity="0.35" stroke="#FFD700" stroke-width="1.2">
    <line x1="256" y1="55"  x2="256" y2="118"/>
    <line x1="355" y1="80"  x2="318" y2="138"/>
    <line x1="415" y1="165" x2="360" y2="195"/>
    <line x1="157" y1="80"  x2="194" y2="138"/>
    <line x1="97"  y1="165" x2="152" y2="195"/>
  </g>

  <!-- MAIN LETTER ש (shin) — the central visual -->
  <text
    x="258" y="310"
    text-anchor="middle"
    font-family="Times New Roman, FrankRuhlLibre, serif"
    font-weight="900"
    font-size="230"
    fill="url(#lg)"
    filter="url(#glow-lg)"
  >ש</text>

  <!-- Bottom gradient fade -->
  <rect x="0" y="330" width="512" height="182" fill="url(#bot-fade)"/>

  <!-- App title -->
  <text
    x="256" y="408"
    text-anchor="middle"
    font-family="Times New Roman, FrankRuhlLibre, serif"
    font-weight="700"
    font-size="31"
    fill="url(#lg)"
    filter="url(#text-glow)"
  >שמות הקודש</text>

  <!-- Brand subtitle -->
  <text
    x="256" y="444"
    text-anchor="middle"
    font-family="Times New Roman, serif"
    font-size="20"
    fill="url(#lg2)"
    opacity="0.78"
  >חי אפליקציות</text>

  <!-- Decorative dots -->
  <circle cx="145" cy="420" r="2.5" fill="#FFD700" opacity="0.45" filter="url(#glow-sm)"/>
  <circle cx="367" cy="420" r="2.5" fill="#FFD700" opacity="0.45" filter="url(#glow-sm)"/>
</g>

<!-- Outer border rings -->
<circle cx="256" cy="256" r="250" fill="none" stroke="rgba(160,110,255,0.32)" stroke-width="2.5"/>
<circle cx="256" cy="256" r="245" fill="none" stroke="rgba(255,200,80,0.12)"  stroke-width="1"/>
</svg>
